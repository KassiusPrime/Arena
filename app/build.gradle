plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.nexus.arenaagent'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.nexus.arenaagent'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}